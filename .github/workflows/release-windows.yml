name: Release (Windows)

# Every push to main builds TorrentFlow for Windows and attaches it to the run as a download.
# Tagging vX.Y.Z also publishes it to a GitHub Release. The in-app updater looks for the
# TorrentFlow-Setup-*.exe asset on the latest release.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v', 'V')
            if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
              throw "Tag '$env:GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH[-prerelease]."
            }
          } else {
            $base = ([xml](Get-Content backend/src/Api/Api.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            $version = "$base-main.$env:GITHUB_RUN_NUMBER"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$([bool]($version -match '-'))".ToLowerInvariant() >> $env:GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Type-checks and builds the web app, publishes the single-file exe with wwwroot next to it,
      # then builds the installer.
      - name: Build the exe and installer
        run: ./scripts/publish-exe.ps1 -Version "${{ steps.version.outputs.version }}" -Installer

      - name: Smoke-test the exe
        run: |
          # Started from a scratch folder without overrides, it must use %LOCALAPPDATA%\TorrentFlow
          # and serve the web app from wwwroot.
          $exe = (Resolve-Path artifacts\exe\TorrentFlow.exe).Path
          $cwd = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'torrentflow-cwd') -Force
          $app = Start-Process $exe -ArgumentList '--urls', 'http://127.0.0.1:3924', '--background' -WorkingDirectory $cwd -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
              if ($app.HasExited) { throw "The published exe exited early with code $($app.ExitCode)." }
              Start-Sleep 1
              try { $ok = (Invoke-RestMethod http://127.0.0.1:3924/api/health).live -eq $true } catch { }
            }
            if (-not $ok) { throw "The published exe did not become healthy." }
            $version = (Invoke-RestMethod http://127.0.0.1:3924/api/desktop).version
            if ($version -ne '${{ steps.version.outputs.version }}') { throw "The exe reports version '$version'." }
            $page = Invoke-WebRequest http://127.0.0.1:3924/downloads -UseBasicParsing
            if ($page.Content -notmatch 'id="root"') { throw "The exe did not serve the web app." }
            if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'TorrentFlow\torrentflow.db'))) { throw "The exe did not use %LOCALAPPDATA%\TorrentFlow." }
          }
          finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Package
        working-directory: artifacts/exe
        run: |
          $zip = "TorrentFlow-${{ steps.version.outputs.version }}-win-x64.zip"
          Compress-Archive -Path TorrentFlow.exe, wwwroot -DestinationPath $zip
          Get-ChildItem *.exe, *.zip | Where-Object Name -ne 'TorrentFlow.exe' |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } |
            Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Attach to this run
        uses: actions/upload-artifact@v4
        with:
          name: TorrentFlow-${{ steps.version.outputs.version }}-windows
          path: |
            artifacts/exe/TorrentFlow-Setup-*.exe
            artifacts/exe/TorrentFlow-*-win-x64.zip
            artifacts/exe/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: TorrentFlow ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/exe/TorrentFlow-Setup-*.exe
            artifacts/exe/TorrentFlow-*-win-x64.zip
            artifacts/exe/SHA256SUMS.txt
