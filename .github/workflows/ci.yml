name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Type-check web
        run: pnpm --dir web run typecheck

      - name: Test web
        working-directory: web
        run: node --test tests/*.test.mjs

      - name: Build web
        run: pnpm --dir web exec vite build

      - name: Build server
        run: dotnet build TorrentFlow.slnx -c Release -p:SkipWebBuild=true -nologo

      - name: Test server
        run: dotnet test TorrentFlow.slnx -c Release --no-build -p:SkipWebBuild=true --nologo
