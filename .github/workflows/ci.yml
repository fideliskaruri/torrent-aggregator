name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-setup:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the tested Node runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Install without a local env file
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org

      - name: Initialize and recheck setup
        run: |
          pnpm run setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run doctor

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure isolated CI paths
        shell: bash
        run: |
          echo "DATABASE_URL=file:$RUNNER_TEMP/torrentflow-ci.db" >> "$GITHUB_ENV"
          echo "DOWNLOAD_DIR=$RUNNER_TEMP/torrentflow-downloads" >> "$GITHUB_ENV"

      - name: Use the tested Node runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm run audit:prod

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript checks
        run: pnpm run typecheck

      - name: Apply and verify Prisma migrations
        run: |
          pnpm run db:migrate:deploy
          pnpm run db:migrate:status

      - name: Run offline unit tests
        run: pnpm run test:unit

      - name: Build production app
        run: pnpm run build

      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run built-app UI gate
        shell: bash
        run: |
          set -Eeuo pipefail
          server_log="$RUNNER_TEMP/torrentflow-server.log"
          setsid pnpm run start >"$server_log" 2>&1 &
          server_pid=$!

          cleanup() {
            kill -TERM -- "-$server_pid" 2>/dev/null || true
            for _ in {1..10}; do
              if ! kill -0 -- "-$server_pid" 2>/dev/null; then
                break
              fi
              sleep 0.2
            done
            kill -KILL -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM

          ready=0
          for _ in {1..60}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$server_log"
              echo "Built app exited before becoming ready."
              exit 1
            fi
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [[ "$ready" -ne 1 ]]; then
            cat "$server_log"
            echo "Built app did not become ready within 60 seconds."
            exit 1
          fi

          if ! pnpm run test:ui; then
            cat "$server_log"
            exit 1
          fi
