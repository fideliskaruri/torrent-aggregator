<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0e" />
    <title>Offline · TorrentFlow</title>
    <!--
      This page is served by the service worker when a navigation cannot reach
      the server, so it cannot depend on any build output: the Next CSS chunk
      may not be in the cache, and deliberately is not cached. Token values are
      therefore inlined and must be kept in sync with globals.css :root.
    -->
    <style>
      :root {
        --bg: #0c0c0e;
        --bg-elevated: #141416;
        --border: #2a2a30;
        --text: #ededf0;
        --text-secondary: #a8a8b3;
        --text-tertiary: #7c7c88;
        --accent: #e8a54b;
        --radius: 10px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 26rem;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 15px;
        font-weight: 600;
      }
      p {
        margin: 0 0 12px;
        font-size: 13px;
        line-height: 1.6;
        color: var(--text-secondary);
      }
      ul {
        margin: 0 0 16px;
        padding-left: 18px;
        font-size: 12px;
        line-height: 1.7;
        color: var(--text-tertiary);
      }
      button {
        min-height: 44px;
        width: 100%;
        border: 0;
        border-radius: var(--radius);
        background: var(--accent);
        color: #141416;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main data-offline-shell>
      <h1>Can't reach your TorrentFlow server</h1>
      <p>
        TorrentFlow runs against your own server. Installed or not, it needs
        that connection — nothing is played or searched offline.
      </p>
      <ul>
        <li>Check the server machine is awake and running TorrentFlow.</li>
        <li>Check this device is on the same network or VPN.</li>
      </ul>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
