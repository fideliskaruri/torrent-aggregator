# Standalone alternative, NOT an override:
# docker compose -f docker-compose.vpn.yml up -d
services:
  gluetun:
    image: qmcgaw/gluetun:v3
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:?Set VPN_SERVICE_PROVIDER in .env}
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:?Set WIREGUARD_PRIVATE_KEY in .env}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:?Set WIREGUARD_ADDRESSES in .env}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-}
      FIREWALL_INPUT_PORTS: "3000,3940"
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "127.0.0.1:3000:3000"
    networks: [tunnel, vpn-egress]
    restart: unless-stopped

  torrentflow:
    image: ghcr.io/fideliskaruri/torrent-aggregator:${TORRENTFLOW_TAG:-latest}
    build: .
    init: true
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      ASPNETCORE_URLS: http://0.0.0.0:3000
      TorrentFlow__DataDirectory: /data
      TorrentFlow__DefaultDownloadDirectory: /media
      TorrentFlow__Engine__ListenPort: "6881"
      TorrentFlow__RemoteAccess__TunnelBindAddress: 0.0.0.0
      TorrentFlow__RemoteAccess__TunnelPort: "3940"
      TorrentFlow__DisplayPathMappings__0__ContainerPath: /media
      TorrentFlow__DisplayPathMappings__0__HostPath: ${MEDIA_DISPLAY_PATH:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ENABLE_1337X: ${ENABLE_1337X:-0}
    volumes:
      - tf-data:/data
      - ${MEDIA_PATH:-tf-media}:/media
    restart: unless-stopped
    stop_grace_period: 60s

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [remote]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    # TorrentFlow shares gluetun's network namespace: target http://gluetun:3940.
    networks: [tunnel, tunnel-egress]
    depends_on:
      torrentflow:
        condition: service_healthy
    restart: unless-stopped

networks:
  tunnel:
    internal: true
  vpn-egress:
  tunnel-egress:

volumes:
  tf-data:
  tf-media:
