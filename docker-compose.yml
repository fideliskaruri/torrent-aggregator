# One-app install: TorrentFlow only (built-in BitTorrent engine).
# Optional external qBittorrent/Transmission can be configured in Settings later.

services:
  torrentflow:
    build: .
    ports:
      # 127.0.0.1 only: there is no sign-in, so publishing to 0.0.0.0 would put
      # an unauthenticated app on the whole LAN. Put a reverse proxy or VPN in
      # front if you want it from another device.
      - "127.0.0.1:3000:3000"
      # Optional: better peer connectivity for built-in engine
      # - "6881:6881"
      # - "6881:6881/udp"
    environment:
      DATABASE_URL: file:./data/prod.db
      # Encrypts stored external-client passwords. Leave unset and a key is
      # generated next to the database on the tf-data volume, which survives
      # image rebuilds.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      ENABLE_1337X: ${ENABLE_1337X:-0}
      # One-app download root (mounted volume)
      DOWNLOAD_DIR: /downloads
    volumes:
      - tf-data:/app/data
      - tf-downloads:/downloads
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  tf-data:
  tf-downloads:
